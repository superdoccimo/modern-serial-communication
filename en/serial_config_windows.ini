# serial_config_windows.ini  
[SERIAL]
# In physical environments, use COM1, COM2, etc.
# In VMware environments, COM2 is recommended.
port = COM2
baudrate = 9600
bytesize = 8
parity = N
stopbits = 1
timeout = 1.0
rtscts = False
dsrdtr = False
xonxoff = False

[APP]
log_level = INFO
timestamp_format = %Y-%m-%d %H:%M:%S.%f