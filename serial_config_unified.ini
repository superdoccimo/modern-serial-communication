# Modern Serial Communication - 統一設定ファイル
# プラットフォーム別設定とアプリケーション設定を統合

[SERIAL_WINDOWS]
port = COM2
baudrate = 9600
bytesize = 8
parity = N
stopbits = 1
timeout = 1.0
rtscts = False
dsrdtr = False
xonxoff = False

[SERIAL_LINUX]
port = /dev/ttyS0
baudrate = 9600
bytesize = 8
parity = N
stopbits = 1
timeout = 1.0
rtscts = False
dsrdtr = False
xonxoff = False

[SERIAL_MACOS]
port = /dev/tty.usbserial
baudrate = 9600
bytesize = 8
parity = N
stopbits = 1
timeout = 1.0
rtscts = False
dsrdtr = False
xonxoff = False

[APP]
# 言語設定 (jp, en, auto)
language = auto
# ログレベル (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
# タイムスタンプ形式
timestamp_format = %%Y-%%m-%%d %%H:%%M:%%S.%%f
# 最大データ行数
max_data_rows = 1000
# スパークライン最大ポイント数
max_sparkline_points = 100
# 自動保存間隔（秒）
auto_save_interval = 300

[NETWORK]
# TCP接続設定
tcp_host = localhost
tcp_port = 5000
use_tcp = false
tcp_timeout = 5.0

[LOGGING]
# ログ出力設定
level = INFO
format = json_lines
output_file = serial_log.jsonl
max_file_size = 10485760
backup_count = 5

[UI]
# UI設定
theme = auto
show_sparkline = true
show_statistics = true
table_auto_scroll = true