# Modern Serial Communication - Modern Python Project Configuration

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-serial-communication"
version = "1.1.0"
authors = [
    {name = "Modern Serial Communication Team", email = "github@minokamo.xyz"},
]
description = "A modern, open-source alternative to commercial serial monitoring tools"
readme = "README.md"
