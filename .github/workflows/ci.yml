# Modern Serial Communication - CI/CD Pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4

    - name: Reject unresolved merge conflicts
      shell: bash
      run: |
        if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )'; then
          echo "Unresolved merge conflict markers found."
          exit 1
        fi
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt || echo "No dev requirements found"
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy common/ --ignore-missing-imports || echo "Type checking completed with warnings"
    
    - name: Test common modules
      run: |
        python -c "from common import *; print('✅ Common modules import test passed')"
        python -c "
        from common.localization import LocalizationManager
        from common.config_manager import ConfigManager
        from common.port_utils import detect_available_ports
        
        # Test localization
        mgr = LocalizationManager('jp')
        assert mgr.get('connect') == '接続'
        
        mgr_en = LocalizationManager('en')
        assert mgr_en.get('connect') == 'Connect'
        
        # Test config manager
        config = ConfigManager()
        serial_config = config.get_serial_config()
        assert 'port' in serial_config
        
        # Test port detection
        ports = detect_available_ports()
        assert isinstance(ports, list)
        
        print('✅ All functional tests passed')
        "
    
    - name: Test dashboard syntax
      run: |
        python -c "import simple_dashboard_refactored; print('✅ Simple dashboard syntax OK')"
        python -c "import serial_dashboard_refactored; print('✅ Enhanced dashboard syntax OK')" || echo "Enhanced dashboard has issues"
    
    - name: Security scan with bandit
      run: |
        pip install bandit
        bandit -r . -f json -o security-report.json || echo "Security scan completed"
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report-${{ matrix.os }}-${{ matrix.python-version }}
        path: security-report.json

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort pylint coverage
    
    - name: Format check with black
      run: |
        black --check --diff .
    
    - name: Import sorting check with isort
      run: |
        isort --check-only --diff .
    
    - name: Code analysis with pylint
      run: |
        pylint common/ --exit-zero --output-format=json > pylint-report.json
    
    - name: Upload code quality reports
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          pylint-report.json

  package:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-packages
        path: dist/
